<header class="topbar">
  <a class="brand" routerLink="/" aria-label="TutorForge home">TutorForge</a>
  <nav aria-label="Main navigation">
    <a routerLink="/learners">Mentees</a>
    <a href="/api/docs">API reference</a>
    <span class="api-status" role="status" aria-live="polite">API {{ apiStatus() }}</span>
    @if (isAuthenticated$ | async) {
      <span class="profile-status" role="status" aria-live="polite">
        {{ profileStatus() }}
      </span>
      <button class="button button-quiet" type="button" (click)="signOut()">Sign out</button>
    } @else {
      <button
        class="button button-primary"
        type="button"
        [disabled]="!authConfigured"
        (click)="signIn()"
      >
        Sign in
      </button>
    }
  </nav>
</header>

@if (loginError()) {
  <p class="error" role="alert">{{ loginError() }}</p>
}

<router-outlet />

<footer>TutorForge &middot; Mentee profiles stay under tutor control.</footer>
