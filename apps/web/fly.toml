app = "tutorforge-web-staging"
primary_region = "ams"

[build]
  dockerfile = "apps/web/Dockerfile"

[build.args]
  API_HOST = "tutorforge-api-staging.internal:3000"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  path = "/"
  timeout = "5s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "256mb"
