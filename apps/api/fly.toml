app = "tutorforge-api-staging"
primary_region = "ams"

[build]
  dockerfile = "apps/api/Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  grace_period = "30s"
  interval = "30s"
  method = "GET"
  path = "/api/v1/health"
  timeout = "5s"

[deploy]
  release_command = "pnpm --filter @tutorforge/api db:migrate:release"
  release_command_timeout = "10m"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
