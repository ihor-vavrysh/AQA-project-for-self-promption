services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tutorforge
      POSTGRES_USER: tutorforge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tutorforge_dev}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tutorforge -d tutorforge']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command:
      ['redis-server', '--requirepass', '${REDIS_PASSWORD:-tutorforge_dev}']
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-tutorforge_dev}
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  redis-data:
